title: Astrostatistics Interest Group
description: American Statistical Association
logo: /images/logo.png

theme: jekyll-theme-cayman

# The site's real styling is assets/css/aig.css, NOT style.css, and that name
# matters. Every gem theme ships assets/css/style.scss, which compiles to
# assets/css/style.css -- exactly where our stylesheet used to live. On a
# rebuild the theme's version could overwrite ours, silently replacing the AIG
# banner with a stock green gradient. Removing `theme:` does not help: the
# github-pages gem then falls back to jekyll-theme-primer, which collides the
# same way. Keeping our CSS under a distinct filename is what fixes it.
# The theme's own style.css is still emitted, unused; nothing links to it.

# This fork is served as a GitHub Pages *project* page, at
#   https://pvl19.github.io/aigamstat.github.io/
# rather than from a custom domain at the site root. Both settings below must
# match the repo they are deployed from -- see README.md before changing them.
baseurl: /aigamstat.github.io
repository: pvl19/aigamstat.github.io

# Drives the second navigation row (see _layouts/default.html). To add a new
# year, create the directory/page and add the year to the front of the list --
# the nav updates everywhere automatically.
jsm_years: ["2026", "2025", "2024", "2023", "2022", "2021", "2020"]
# Years shown in the "Previous Winners" dropdown; each needs a matching
# competition/winners/<year>.md page.
winner_years: ["2025", "2024", "2023", "2022", "2021", "2020", "2019"]
# Past years in the About Us > Officers dropdown; the current year's officers
# live on about/officers/index.md, not in this list.
officer_years: ["2025", "2024", "2023", "2022", "2021", "2020", "2019", "2018"]
